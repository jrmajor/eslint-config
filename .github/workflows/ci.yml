name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
          run_install: true

      - name: Setup Node
        run: pnpm env use --global 24

      - name: Check types
        run: pnpm check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
          run_install: true

      - name: Setup Node
        run: pnpm env use --global 24

      - name: Run ESLint
        run: pnpm lint

  integration:
    name: Integration / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - arbor
          - bajki-muza
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: eslint-config

      - name: Checkout the other repo
        uses: actions/checkout@v6
        with:
          repository: jrmajor/${{ matrix.project }}
          path: integration

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
          package_json_file: integration/package.json
          cache_dependency_path: integration/pnpm-lock.yaml

      - name: Install npm dependencies
        working-directory: integration
        run: pnpm add -D file:../eslint-config && pnpm upgrade --latest eslint

      - name: Run ESLint
        continue-on-error: true
        working-directory: integration
        run: pnpm lint --fix

      - name: Show diff
        working-directory: integration
        run:  git diff --color=always -- . ':(exclude)package.json' ':(exclude)pnpm-lock.yaml'

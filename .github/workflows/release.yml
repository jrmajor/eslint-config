name: Release

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.4.0)
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # empty on branch pushes, which makes this a dry run
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG || github.sha }}
          fetch-depth: 0

      - name: Check the tag
        if: env.TAG != ''
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main"; exit 1; }
          [ "v$(jq -r .version package.json)" = "$TAG" ] || { echo "package.json version does not match $TAG"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
          run_install: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        run: pnpm publish --no-git-checks --access public ${{ env.TAG == '' && '--dry-run' || '' }}
